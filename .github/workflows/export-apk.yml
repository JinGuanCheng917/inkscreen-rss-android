name: Export APK for API download
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful APK build run ID
        required: true
permissions:
  actions: read
  contents: write
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: InkScreen-RSS-APK
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: delivery
      - uses: actions/github-script@v7
        env:
          BUILD_RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const repo = {...context.repo};
            const tree = [], files = [];
            for (const name of fs.readdirSync('delivery').sort()) {
              const data = fs.readFileSync('delivery/' + name);
              const record = {name, bytes:data.length, sha256:crypto.createHash('sha256').update(data).digest('hex'), chunks:[]};
              for (let start=0; start<data.length; start+=262144) {
                const chunk = data.subarray(start,start+262144);
                const blob = (await github.rest.git.createBlob({...repo,content:chunk.toString('base64'),encoding:'base64'})).data;
                const path = name + '.part-' + String(record.chunks.length).padStart(3,'0');
                tree.push({path,mode:'100644',type:'blob',sha:blob.sha});
                record.chunks.push({sha:blob.sha,bytes:chunk.length});
              }
              files.push(record);
            }
            tree.push({path:'delivery.json',mode:'100644',type:'blob',content:JSON.stringify({runId:process.env.BUILD_RUN_ID,files},null,2)});
            const created = (await github.rest.git.createTree({...repo,tree})).data;
            const commit = (await github.rest.git.createCommit({...repo,message:'Temporary verified APK delivery',tree:created.sha})).data;
            await github.rest.git.createRef({...repo,ref:'refs/heads/apk-download-'+context.runId,sha:commit.sha});
            core.notice('API delivery branch: apk-download-'+context.runId);
